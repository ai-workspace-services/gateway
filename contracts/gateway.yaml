schema_version: v1

gateway:
  adapter: kong
  mode: traditional
  environment: uat
  domains:
    - ai.onwalk.net
    - direct.ai.onwalk.net
  runtime_config_backend: postgresql
  etcd: false

upstreams:
  - id: kong
    protocol: http
    host: 127.0.0.1
    port: 8000
    public: false
  - id: apisix
    protocol: http
    host: 127.0.0.1
    port: 9080
    public: false
  - id: new-api
    protocol: http
    public: false
    nodes:
      - host: 127.0.0.1
        port: 3000
        weight: 100
    schedule:
      algorithm: round-robin
      connect_timeout_ms: 3000
      read_timeout_ms: 120000
  - id: litellm
    protocol: http
    public: false
    nodes:
      - host: 127.0.0.1
        port: 4000
        weight: 100
    schedule:
      algorithm: round-robin
      connect_timeout_ms: 3000
      read_timeout_ms: 120000

tenants:
  - id: personal
    enabled: false
    allowed_models: [claude, gpt, grok]
    rate_limit_per_minute: 60

routes:
  - id: ai-new-api
    hosts: [ai.onwalk.net]
    paths: [/v1]
    upstream: new-api
    tenant_ref: personal
    auth:
      mode: key-auth

  - id: ai-litellm
    hosts: [direct.ai.onwalk.net]
    paths: [/v1]
    upstream: litellm
    tenant_ref: personal
    auth:
      mode: key-auth
