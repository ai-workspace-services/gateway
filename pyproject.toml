[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway-contracts"
version = "0.1.0"
description = "Vendor-neutral AI Gateway contracts and configuration renderers"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
gatewayctl = "gatewayctl.cli:main"

[tool.setuptools.packages.find]
include = ["gatewayctl*"]
